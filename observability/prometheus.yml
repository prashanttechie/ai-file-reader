global:
  scrape_interval: 15s
  external_labels:
    monitor: 'ai-file-reader-monitor'

scrape_configs:
  - job_name: 'log-interpreter-agent'
    static_configs:
      - targets: ['ai-file-reader-network:3000']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['ai-file-reader-node-exporter:9100']

  - job_name: 'grafana'
    static_configs:
      - targets: ['ai-file-reader-grafana:3000']
    metrics_path: '/metrics'
